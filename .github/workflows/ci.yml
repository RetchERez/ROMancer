name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use canonical same-volume test temporary paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'romancer-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp", "TMP=$testTemp" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- romancer/ui/app.bundle.js romancer/ui/bundle.json
      - run: npm test
      - name: Catalog files, pins and counts agree
        run: python -B tools/prune_catalog.py --check
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/package_source.py . dist/ci-source.zip
      - run: python -B tools/audit_release.py --source dist/ci-source.zip
      - run: python -c "from pathlib import Path; Path('work_private').mkdir(exist_ok=True)"
      - run: python -B tools/verify_v1.py --output work_private/workflow.json --work-dir work_private/fixtures
  linux-bundle:
    # Builds the Linux package on a real Linux kernel and runs it: launcher check, playtest
    # engines, tracing engines, server start and local API. The engines are taken unchanged
    # from the newest published Linux archive and must match the pins in this checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Find the newest published Linux archive
        id: donor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          row="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft | not) | .assets[] | select(.name | test("^ROMancer-v[0-9.]+-Linux-x86_64[.]tar[.]gz$"))] | sort_by(.created_at) | last | select(. != null) | [.id, .name] | @tsv')"
          if [ -z "$row" ]; then
            echo "No published Linux archive to take the engines from. Source checks run in the test job."
            exit 0
          fi
          echo "id=$(printf %s "$row" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(printf %s "$row" | cut -f2)" >> "$GITHUB_OUTPUT"
      - name: Download it
        if: steps.donor.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROMANCER_DONOR_ASSET: ${{ steps.donor.outputs.id }}
          ROMANCER_DONOR_NAME: ${{ steps.donor.outputs.name }}
        run: |
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ROMANCER_DONOR_ASSET" > "$RUNNER_TEMP/$ROMANCER_DONOR_NAME"
      - name: Build the Linux package and run it
        if: steps.donor.outputs.id != ''
        env:
          ROMANCER_DONOR_NAME: ${{ steps.donor.outputs.name }}
        run: bash linux/ci_smoke.sh "$RUNNER_TEMP/$ROMANCER_DONOR_NAME" "$RUNNER_TEMP/linux-smoke"
      - name: Run the package on the oldest supported glibc (Debian 10)
        if: steps.donor.outputs.id != ''
        run: |
          docker run --rm -v "$RUNNER_TEMP/linux-smoke:/w:ro" debian:10 bash -c '
            set -euo pipefail
            cd /w/pkg*/ROMancer-v*-Linux-x86_64
            ./ROMancer.sh --check
            RT="$PWD/ROMancer Files/Runtime"; PY="$RT/python/bin/python3"
            "$PY" -I -B "$RT/app/tools/verify_engines.py" --workspace /tmp/engines --output /tmp/engines.json > /dev/null
            "$PY" -I -B "$RT/app/tools/verify_trace_engines.py" --workspace /tmp/trace --output /tmp/trace.json > /dev/null
            "$PY" -I -c "import json;assert all(json.load(open(f))[\"ok\"] for f in (\"/tmp/engines.json\", \"/tmp/trace.json\"))"
            echo "OK on glibc $(getconf GNU_LIBC_VERSION)"'
  windows-bundle:
    # Draft release assets require repository push access on GitHub. The token
    # is exposed only to the download step; checkout never persists it.
    # Fork PRs run the read-only test matrix instead of this trusted packaging job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Find the pinned release engine asset
        id: engines
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = python -c "from romancer.core_pins import CORE_ARCHIVE; print(CORE_ARCHIVE['file'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the pinned engine archive name' }
          $assets = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].assets[] | [.id,.name] | @tsv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list release assets' }
          $matchesByName = @($assets | ForEach-Object { $id, $assetName = $_ -split "`t", 2
            if ($assetName -ceq $name) { $id } })
          # Each release re-attaches the same pinned archive; the download is checked against the pin below.
          if ($matchesByName.Count -eq 0) {
            Write-Output "The pinned engine archive has not been attached. Source checks run in the test job."
            exit 0
          }
          "id=$($matchesByName[0])" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: steps.engines.outputs.id != ''
        run: python -m pip install -r requirements.txt
      - if: steps.engines.outputs.id != ''
        run: python -B tools/fetch_runtime.py --downloads work_private/runtime-downloads
      - name: Download and verify the engine pack
        if: steps.engines.outputs.id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROMANCER_ENGINE_ASSET: ${{ steps.engines.outputs.id }}
          ROMANCER_ENGINE_NAME: ${{ steps.engines.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path 'work_private/runtime-downloads' $env:ROMANCER_ENGINE_NAME
          gh api -H 'Accept: application/octet-stream' "repos/$env:GITHUB_REPOSITORY/releases/assets/$env:ROMANCER_ENGINE_ASSET" > $archive
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed engine asset download failed' }
          python -B tools/fetch_cores.py --downloads work_private/runtime-downloads --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed engine asset verification failed' }
      - if: steps.engines.outputs.id != ''
        run: python -B tools/fetch_installer.py --downloads work_private/runtime-downloads
      - if: steps.engines.outputs.id != ''
        run: python -B tools/package_windows.py --app . --downloads work_private/runtime-downloads --cores work_private/runtime-downloads/cores --output work_private/windows-bundle --zip work_private/windows.zip
      - if: steps.engines.outputs.id != ''
        run: python -B tools/package_installer.py --payload work_private/windows-bundle --compiler work_private/runtime-downloads/nsis-3.13.zip --output work_private/Setup.exe
      - name: Install and check with bundled runtime
        if: steps.engines.outputs.id != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $PWD 'work_private/windows-bundle'
          $target = Join-Path $PWD 'work_private/clean install test'
          $python = Join-Path $payload 'python/python.exe'
          New-Item -ItemType Directory -Path (Join-Path $target 'workspace') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'workspace/preserve.txt') -Value 'preserved project marker'
          $setup = Start-Process -FilePath (Join-Path $PWD 'work_private/Setup.exe') -ArgumentList @('/S', ('/D=' + $target)) -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Setup executable failed' }
          $entry = Get-ItemProperty -LiteralPath 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ROMancer'
          if ($entry.InstallLocation -ne $target -or $entry.DisplayVersion -ne '1.3.8') { throw 'Apps registration differs' }
          $active = Get-Content -LiteralPath (Join-Path $target 'active.json') -Raw | ConvertFrom-Json
          if ($active.slot -notmatch '^1[.]3[.]8-[0-9a-f]{16}$') { throw 'Package slot differs' }
          $version = Join-Path $target ('versions/' + $active.slot)
          $installedPython = Join-Path $version 'python/python.exe'
          $env:PATH = (Join-Path $version 'python') + ';' + $env:SystemRoot + '/System32;' + $env:SystemRoot + '/System32/WindowsPowerShell/v1.0'
          $launcher = Join-Path $target 'Open ROMancer.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $launcher -Check
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher check failed' }
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Headless installed startup failed' }
          $connection = Get-Content -LiteralPath (Join-Path $target 'workspace/connection.json') -Raw | ConvertFrom-Json
          try {
            $parts = $connection.url -split '/#token=', 2
            $headers = @{ Authorization = 'Bearer ' + $parts[1] }
            $body = @{ operation = 'system.capabilities'; parameters = @{} } | ConvertTo-Json -Compress
            $capabilities = Invoke-RestMethod -Uri ($parts[0] + '/api/call') -Method Post -Headers $headers -ContentType 'application/json' -Body $body
            if ($capabilities.version -ne $active.version) { throw 'Installed server version differs' }
            foreach ($guideFile in @('index.html', 'guide.css', 'guide.pdf', 'screenshots/265-recognized-game-structures.png', 'screenshots/249-readable-theme-and-advanced-settings.png')) {
              $download = Join-Path $PWD ('work_private/guide-' + ($guideFile -replace '/', '-'))
              Invoke-WebRequest -Uri ($parts[0] + '/user-guide/' + $guideFile) -OutFile $download
              $included = Join-Path $version ('app/user-guide/' + $guideFile)
              if ((Get-FileHash -LiteralPath $download).Hash -ne (Get-FileHash -LiteralPath $included).Hash) { throw 'Installed guide bytes differ' }
            }
            & $installedPython -I -B (Join-Path $version 'app/tools/verify_v1.py') --output (Join-Path $PWD 'work_private/installed-workflow.json') --work-dir (Join-Path $PWD 'work_private/installed-fixtures')
            if ($LASTEXITCODE -ne 0) { throw 'Installed system workflows failed' }
            & $installedPython -I -B (Join-Path $version 'app/tools/verify_engines.py') --workspace (Join-Path $PWD 'work_private/automatic-engines') --output (Join-Path $PWD 'work_private/engine-proof.json')
            if ($LASTEXITCODE -ne 0) { throw 'Automatic bundled engines failed' }
          } finally {
            Stop-Process -Id $connection.pid -ErrorAction SilentlyContinue
          }
          $uninstaller = Start-Process -FilePath (Join-Path $target 'Uninstall ROMancer.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw 'Uninstaller failed' }
          # NSIS may finish in its temporary child after the entry process exits.
          $uninstallDeadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath (Join-Path $target 'active.json')) -and (Get-Date) -lt $uninstallDeadline) { Start-Sleep -Milliseconds 100 }
          if (Test-Path -LiteralPath (Join-Path $target 'active.json')) { throw 'Uninstall did not deactivate' }
          if (-not (Test-Path -LiteralPath (Join-Path $target 'workspace/preserve.txt'))) { throw 'Uninstall removed a user project' }
          if (Test-Path -LiteralPath 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ROMancer') { throw 'Apps entry remains after uninstall' }
