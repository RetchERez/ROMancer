name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- romancer/ui/app.bundle.js romancer/ui/bundle.json
      - run: npm test
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/package_source.py . dist/ci-source.zip
      - run: python -B tools/audit_release.py --source dist/ci-source.zip
      - run: python -c "from pathlib import Path; Path('work_private').mkdir(exist_ok=True)"
      - run: python -B tools/verify_v1.py --output work_private/workflow.json --work-dir work_private/fixtures
