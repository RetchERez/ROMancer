name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use canonical same-volume test temporary paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'romancer-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp", "TMP=$testTemp" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- romancer/ui/app.bundle.js romancer/ui/bundle.json
      - run: npm test
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/package_source.py . dist/ci-source.zip
      - run: python -B tools/audit_release.py --source dist/ci-source.zip
      - run: python -c "from pathlib import Path; Path('work_private').mkdir(exist_ok=True)"
      - run: python -B tools/verify_v1.py --output work_private/workflow.json --work-dir work_private/fixtures
  windows-bundle:
    # Draft release assets require repository push access on GitHub. The token
    # is exposed only to the download step; checkout never persists it.
    # Fork PRs run the read-only test matrix instead of this trusted packaging job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -B tools/fetch_runtime.py --downloads work_private/runtime-downloads
      - name: Download the reviewed engine pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern ROMancer-v1.0-Engines.zip --dir work_private/runtime-downloads
      - run: python -B tools/fetch_cores.py --downloads work_private/runtime-downloads --archive work_private/runtime-downloads/ROMancer-v1.0-Engines.zip
      - run: python -B tools/fetch_installer.py --downloads work_private/runtime-downloads
      - run: python -B tools/package_windows.py --app . --downloads work_private/runtime-downloads --cores work_private/runtime-downloads/cores --output work_private/windows-bundle --zip work_private/windows.zip
      - run: python -B tools/package_installer.py --payload work_private/windows-bundle --compiler work_private/runtime-downloads/nsis-3.13.zip --output work_private/Setup.exe
      - name: Install and check with bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $PWD 'work_private/windows-bundle'
          $target = Join-Path $PWD 'work_private/clean install test'
          $python = Join-Path $payload 'python/python.exe'
          New-Item -ItemType Directory -Path (Join-Path $target 'workspace') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'workspace/preserve.txt') -Value 'preserved project marker'
          $setup = Start-Process -FilePath (Join-Path $PWD 'work_private/Setup.exe') -ArgumentList @('/S', ('/D=' + $target)) -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Setup executable failed' }
          $entry = Get-ItemProperty -LiteralPath 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ROMancer'
          if ($entry.InstallLocation -ne $target) { throw 'Apps registration differs' }
          $active = Get-Content -LiteralPath (Join-Path $target 'active.json') -Raw | ConvertFrom-Json
          $version = Join-Path $target ('versions/' + $active.version)
          $installedPython = Join-Path $version 'python/python.exe'
          $env:PATH = (Join-Path $version 'python') + ';' + $env:SystemRoot + '/System32;' + $env:SystemRoot + '/System32/WindowsPowerShell/v1.0'
          $launcher = Join-Path $target 'Open ROMancer.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $launcher -Check
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher check failed' }
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Headless installed startup failed' }
          $connection = Get-Content -LiteralPath (Join-Path $target 'workspace/connection.json') -Raw | ConvertFrom-Json
          try {
            $parts = $connection.url -split '/#token=', 2
            $headers = @{ Authorization = 'Bearer ' + $parts[1] }
            $body = @{ operation = 'system.capabilities'; parameters = @{} } | ConvertTo-Json -Compress
            $capabilities = Invoke-RestMethod -Uri ($parts[0] + '/api/call') -Method Post -Headers $headers -ContentType 'application/json' -Body $body
            if ($capabilities.version -ne $active.version) { throw 'Installed server version differs' }
            & $installedPython -I -B (Join-Path $version 'app/tools/verify_v1.py') --output (Join-Path $PWD 'work_private/installed-workflow.json') --work-dir (Join-Path $PWD 'work_private/installed-fixtures')
            if ($LASTEXITCODE -ne 0) { throw 'Installed five-system workflows failed' }
            & $installedPython -I -B (Join-Path $version 'app/tools/verify_engines.py') --workspace (Join-Path $PWD 'work_private/automatic-engines') --output (Join-Path $PWD 'work_private/engine-proof.json')
            if ($LASTEXITCODE -ne 0) { throw 'Automatic bundled engines failed' }
          } finally {
            Stop-Process -Id $connection.pid -ErrorAction SilentlyContinue
          }
          $uninstaller = Start-Process -FilePath (Join-Path $target 'Uninstall ROMancer.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path -LiteralPath (Join-Path $target 'active.json')) { throw 'Uninstall did not deactivate' }
          if (-not (Test-Path -LiteralPath (Join-Path $target 'workspace/preserve.txt'))) { throw 'Uninstall removed a user project' }
          if (Test-Path -LiteralPath 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ROMancer') { throw 'Apps entry remains after uninstall' }
